<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="Three camera angles and whether floor width can be recovered">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 15px; font-weight: 500; fill: var(--fg); }
    .cap { font-size: 13px; fill: var(--muted); }
    .pillt { font-size: 14px; font-weight: 500; }
    .frame { fill: none; stroke: var(--line); stroke-width: 1.5; }
    :root { --fg: #3d3d3a; --muted: #6b6b66; --line: #c9c7bd; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e8e6df; --muted: #a8a6a0; --line: #55554f; } }
  </style>

  <text class="title" x="130" y="44" text-anchor="middle">straight down</text>
  <text class="title" x="340" y="44" text-anchor="middle">corner angle</text>
  <text class="title" x="550" y="44" text-anchor="middle">straight-on</text>

  <rect class="frame" x="45" y="70" width="170" height="150" rx="6"/>
  <rect class="frame" x="255" y="70" width="170" height="150" rx="6"/>
  <rect class="frame" x="465" y="70" width="170" height="150" rx="6"/>

  <polygon points="80,190 180,190 180,105 80,105" fill="#d6efe6" stroke="#1d9e75" stroke-width="1.5"/>
  <polygon points="285,195 390,205 410,110 300,95" fill="#d6efe6" stroke="#1d9e75" stroke-width="1.5"/>
  <polygon points="490,205 610,205 585,110 515,110" fill="#fbe4c9" stroke="#ba7517" stroke-width="1.5"/>

  <text class="cap" x="130" y="240" text-anchor="middle">both pairs parallel</text>
  <text class="cap" x="340" y="240" text-anchor="middle">both pairs angle in</text>
  <text class="cap" x="550" y="240" text-anchor="middle">only sides angle in</text>

  <rect x="55" y="254" width="150" height="28" rx="8" fill="#d6efe6" stroke="#1d9e75" stroke-width="1"/>
  <text class="pillt" x="130" y="272" text-anchor="middle" fill="#0f6e56">width exact</text>
  <rect x="265" y="254" width="150" height="28" rx="8" fill="#d6efe6" stroke="#1d9e75" stroke-width="1"/>
  <text class="pillt" x="340" y="272" text-anchor="middle" fill="#0f6e56">width works</text>
  <rect x="475" y="254" width="150" height="28" rx="8" fill="#fbe4c9" stroke="#ba7517" stroke-width="1"/>
  <text class="pillt" x="550" y="272" text-anchor="middle" fill="#854f0b">type width in</text>
</svg>
